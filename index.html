<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>굿바이브</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fbf3e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="굿바이브">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#fbf3e0;--paper:#fff;--ink:#1c1a17;--text:#1c1a17;--muted:#7a7266;--muted2:#b9b1a2;--line:#e6dcc4;
  --blue:#2f6fd6;--red:#e0443a;--yellow:#ffd93d;--coral:#ff6b6b;--mint:#8ee3c8;
  --bw:2.5px;--sh:3px 3px 0 var(--ink);--sh2:2px 2px 0 var(--ink);--r:14px;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
#app{max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(48px + env(safe-area-inset-bottom));min-height:100vh}

/* 스티커 공통 */
.stk{background:var(--paper);border:var(--bw) solid var(--ink);box-shadow:var(--sh);border-radius:var(--r)}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;height:64px;position:relative}
.topbar .title{position:absolute;left:0;right:0;text-align:center;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.5px;pointer-events:none}
.iconbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:20px;background:var(--paper);border:var(--bw) solid var(--ink);box-shadow:var(--sh2)}
.iconbtn:active{transform:translate(2px,2px);box-shadow:none}
.help{color:var(--muted);font-size:14px;line-height:1.5;margin:6px 0 18px}

/* week header */
.weekhead{display:flex;align-items:center;gap:8px;margin-top:4px}
.weekhead .wtitle{font-family:var(--display);font-weight:400;font-size:22px;flex:1;display:flex;align-items:center;gap:10px}
.weekhead .wtitle .dot{width:26px;height:26px;border-radius:50%;background:var(--yellow);border:var(--bw) solid var(--ink);box-shadow:var(--sh2)}
.pillbtn{border:var(--bw) solid var(--ink);border-radius:10px;height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background:var(--paper);box-shadow:var(--sh2)}
.pillbtn:active{transform:translate(2px,2px);box-shadow:none}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);margin:16px 0 8px;text-align:center}
.wd .dow{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.wd .dow.sat{color:var(--blue)}.wd .dow.sun{color:var(--red)}
.wd .badge{position:relative;width:38px;height:38px;margin:0 auto;border:var(--bw) solid var(--ink);border-radius:11px;box-shadow:var(--sh2);background:var(--paper)}
.wd .badge svg{display:none}
.wd .badge .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);font-size:14px}
.wd .badge.zero .n{color:var(--muted2)}
.wd .num{margin:8px auto 0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.wd.sel .num{background:var(--ink);color:#fff}
.wd .num.sat{color:var(--blue)}.wd .num.sun{color:var(--red)}
.wd.sel .num.sat,.wd.sel .num.sun{color:#fff}
.wd{cursor:pointer;padding:4px 0}
.wd:active .badge{transform:translate(2px,2px);box-shadow:none}

/* category blocks */
.cat{margin-top:22px}
.cathead{display:inline-flex;align-items:center;gap:10px;border:var(--bw) solid var(--ink);box-shadow:var(--sh);border-radius:var(--r);padding:6px 6px 6px 14px;font-family:var(--display);font-weight:400;font-size:19px;color:var(--ink)!important;transform:rotate(-1.5deg);transform-origin:left center;margin-left:2px}
.cat:nth-child(even) .cathead{transform:rotate(1.2deg)}
.cathead .plus{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;font-family:system-ui,sans-serif}
.cathead.wide{display:flex;justify-content:space-between;padding:10px 10px 10px 18px;transform:none;width:100%}
.list{margin-top:10px}
.item{position:relative;overflow:hidden;border-radius:12px;touch-action:pan-y}
.item .sw{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;background:var(--bg);position:relative;transition:transform .18s;width:100%}
.item.swiping .sw{transition:none}
.item .swbg{visibility:hidden;position:absolute;inset:0;display:flex;align-items:center;padding-left:14px;background:var(--mint);font-weight:800;font-size:14px;color:var(--ink);border-radius:12px}
.item.swiping .swbg{visibility:visible}
.item.ready .swbg{background:var(--yellow)}
.item.dragging .sw{background:var(--paper)}
.toast .undo{margin-left:12px;background:var(--ink);color:#fff;border-radius:8px;padding:5px 10px;font-weight:800;font-size:13px}
.item .chk{flex:none;width:28px;height:28px;margin-top:1px;border:var(--bw) solid var(--ink);border-radius:8px;background:var(--paper);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.item .chk svg{display:none}
.item.done .chk{background:var(--coral);transform:rotate(-8deg)}
.item.done .chk::after{content:"";width:14px;height:8px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-2px) rotate(-45deg)}
.item .body{flex:1;min-width:0;padding-top:4px}
.item .ttl{font-size:16px;line-height:1.35;word-break:break-word}
.item.done .ttl{color:var(--muted2);text-decoration:line-through}
.item .memo{color:var(--muted);font-size:13px;margin-top:5px;white-space:pre-line;line-height:1.5}
.item.done .memo{color:var(--muted2)}
.item .tag{display:inline-block;font-size:10px;color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:middle;background:var(--paper);font-weight:700}
.item .handle{flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--muted2);font-size:20px;touch-action:none;cursor:grab;border-radius:10px}
.item.dragging{background:var(--paper);box-shadow:0 0 0 var(--bw) var(--ink),var(--sh);border-radius:var(--r);z-index:5;will-change:transform}
.item.nodrag .handle{visibility:hidden}
.empty{color:var(--muted2);font-size:14px;padding:10px 6px}

/* routine list */
.rt{display:flex;align-items:center;gap:8px;padding:12px 8px 12px 14px;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh2);margin:10px 3px 12px 0}
.rt .body{flex:1;min-width:0}
.rt .l1{font-size:16px;font-weight:700}
.rt .l1 .st{color:var(--blue);font-weight:800}
.rt .l1 .st.end{color:var(--muted)}
.rt .l1 .st.soon{color:#c98a00}
.rt .l1 .sep{color:var(--muted2);margin:0 6px;font-weight:400}
.rt .l2{color:var(--muted);font-size:13px;margin-top:5px}
.rt .chev{color:var(--muted2);font-size:18px;padding:0 6px}
.rt .handle{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--muted2);touch-action:none;cursor:grab}
.rt.dragging{box-shadow:var(--sh);z-index:5;will-change:transform}

/* category manage */
.rowhead{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px}
.rowhead b{font-family:var(--display);font-weight:400;font-size:20px}
.addbtn{background:var(--yellow);border:var(--bw) solid var(--ink);box-shadow:var(--sh2);border-radius:12px;padding:10px 16px;font-weight:800;font-size:15px}
.addbtn:active{transform:translate(2px,2px);box-shadow:none}
.crow{display:flex;align-items:center;gap:12px;border:var(--bw) solid var(--ink);box-shadow:var(--sh);border-radius:var(--r);padding:14px 16px 14px 20px;margin:0 3px 14px 0;font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink)}
.crow .nm{flex:1;color:var(--ink)!important}
.crow .nm span{font-family:-apple-system,system-ui,sans-serif}
.crow .edit{color:var(--ink);font-weight:700;font-size:13px;font-family:-apple-system,system-ui,sans-serif;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:3px 8px}
.crow .handle{color:var(--ink);opacity:.5;touch-action:none;cursor:grab;padding:0 2px;font-size:20px}
.crow.dragging{z-index:5;will-change:transform}

/* reminder rows */
.rmrow{display:flex;align-items:center;gap:14px;padding:12px 14px;border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh2);margin:0 3px 12px 0}
.rmrow .tm{font-family:var(--display);font-size:30px;font-weight:400;letter-spacing:1px;flex:1}
.rmrow.off .tm{color:var(--muted2)}
.rmrow .sub{color:var(--muted);font-size:13px;margin-top:0;font-weight:400;font-family:-apple-system,system-ui,sans-serif;letter-spacing:0}
.switch{width:52px;height:30px;border-radius:999px;background:var(--paper);border:var(--bw) solid var(--ink);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch.on{background:var(--mint)}.switch.on::after{transform:translateX(21px)}
.note{background:var(--paper);border:2px dashed var(--ink);border-radius:var(--r);padding:14px 16px;font-size:14px;line-height:1.6;color:#4a443b;margin:14px 0}
.note b{color:var(--ink)}
.status{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800;border:2px solid var(--ink)}
.status.ok{background:var(--mint)}.status.no{background:var(--coral)}.status.ask{background:var(--yellow)}

/* menu popover */
.dim{position:fixed;inset:0;background:rgba(28,26,23,.45);z-index:20}
.popmenu{position:fixed;top:calc(12px + env(safe-area-inset-top));right:16px;background:var(--bg);border:var(--bw) solid var(--ink);box-shadow:var(--sh);border-radius:20px;padding:14px;z-index:21;width:260px}
.popmenu button{display:block;width:100%;background:var(--paper);border:var(--bw) solid var(--ink);box-shadow:var(--sh2);border-radius:12px;padding:13px;font-size:16px;font-weight:800;margin-bottom:12px}
.popmenu button:active{transform:translate(2px,2px);box-shadow:none}
.popmenu button:last-child{margin-bottom:4px}
.popmenu .acct{padding:2px 6px 10px;text-align:center;line-height:1.4}
.popmenu .acct b{display:block;font-size:15px}
.popmenu .acct small{color:var(--muted);font-size:12px}
.popmenu button.sub{background:var(--bg);font-size:14px;padding:10px;margin-bottom:16px}

/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:22;background:var(--bg);border-top:var(--bw) solid var(--ink);border-radius:24px 24px 0 0;max-width:520px;margin:0 auto;
  padding:10px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;box-shadow:0 -6px 0 rgba(28,26,23,.15);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:6px;border-radius:3px;background:var(--ink);margin:0 auto 14px;opacity:.35}
.sheet h3{margin:4px 0 14px;font-family:var(--display);font-weight:400;font-size:22px;text-align:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:700}
.field input[type=text],.field textarea,.field select,.field input[type=date],.field input[type=time],.field input[type=datetime-local]{
  width:100%;border:var(--bw) solid var(--ink);background:var(--paper);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;min-height:48px}
.field input:focus,.field textarea:focus{box-shadow:var(--sh2)}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.field .row{display:flex;gap:10px}
.field .row>*{flex:1}
.bigname{width:100%;border:0;border-bottom:var(--bw) solid var(--ink);font-family:var(--display);font-size:24px;padding:10px 4px;outline:none;background:none}
.bigname::placeholder{color:var(--muted2)}
.days{display:flex;gap:6px}
.days button{flex:1;height:40px;border-radius:10px;background:var(--paper);border:var(--bw) solid var(--ink);font-weight:800;color:var(--muted2)}
.days button.on{background:var(--yellow);color:var(--ink);box-shadow:var(--sh2)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:38px;height:38px;border-radius:10px;border:var(--bw) solid var(--ink)}
.swatches button.on{box-shadow:var(--sh);transform:rotate(-6deg)}
.btns{display:flex;gap:12px;margin-top:18px}
.btn{flex:1;border-radius:12px;padding:14px;font-weight:800;font-size:16px;background:var(--yellow);color:var(--ink);border:var(--bw) solid var(--ink);box-shadow:var(--sh)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.ghost{background:var(--paper)}
.btn.danger{background:var(--coral);flex:0 0 auto;padding:14px 18px}
.btn.wide{width:100%}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.quick button{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.quick button:active{background:var(--yellow)}
.catpick{display:flex;flex-wrap:wrap;gap:8px}
.catpick button{border-radius:10px;padding:8px 13px;font-weight:800;font-size:14px;border:var(--bw) solid var(--ink);color:var(--ink)!important;opacity:.55}
.catpick button.on{opacity:1;box-shadow:var(--sh2);transform:rotate(-2deg)}

/* month picker */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:6px}
.mgrid .h{font-size:12px;color:var(--muted);padding:6px 0;font-weight:700}
.mgrid .d{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:15px;cursor:pointer;position:relative;font-weight:600}
.mgrid .d.other{color:var(--muted2)}
.mgrid .d.sel{background:var(--ink);color:#fff}
.mgrid .d.today{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.mgrid .d .dots{display:flex;gap:2px;height:6px;margin-top:2px}
.mgrid .d .dots i{width:6px;height:6px;border-radius:50%;display:block;border:1.5px solid var(--ink)}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%) rotate(-1deg);bottom:calc(24px + env(safe-area-inset-bottom));background:var(--yellow);color:var(--ink);border:var(--bw) solid var(--ink);box-shadow:var(--sh);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:700;z-index:30;max-width:90vw;animation:up .2s}
.toast b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:16px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:16px;background:var(--yellow);color:var(--ink);border:var(--bw) solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-size:32px;display:flex;align-items:center;justify-content:center;z-index:10;font-family:system-ui,sans-serif}
.fab:active{transform:translate(3px,3px);box-shadow:none}
@media (min-width:600px){.fab{right:calc(50% - 260px + 16px)}}
.backup textarea{width:100%;min-height:160px;border-radius:12px;border:var(--bw) solid var(--ink);background:var(--paper);padding:12px;font-family:ui-monospace,monospace;font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ========== 저장소 ========== */
let fbUser=null,fbDb=null,fbState="idle",unsubSnap=null,pushTimer=null;
function schedulePush(){if(!fbUser||!fbDb)return;clearTimeout(pushTimer);pushTimer=setTimeout(pushNow,600);}
const KEY='dayplanner.v1';
const PALETTE=["#ffd93d","#8ee3c8","#ffb3d1","#c9b6ff","#ffc09f","#d4f37a","#9fd3ff","#ff8c82","#7fe0e6","#ffb347","#f0e6c8","#ffffff"];
const OLD_COLORS={"#ff5a5f":"#ffd93d","#ff9f1c":"#8ee3c8","#b455f5":"#ffb3d1","#ffb3c6":"#c9b6ff","#f5c518":"#ffc09f","#8bc34a":"#d4f37a","#4dd0e1":"#9fd3ff","#2fb37b":"#8ee3c8","#2f7cf6":"#9fd3ff","#7b61ff":"#c9b6ff","#ff7ab6":"#ffb3d1","#8d6e63":"#ffb347","#607d8b":"#f0e6c8","#111111":"#ffffff"};
const DOW=['일','월','화','수','목','금','토'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function defaultDB(){
  const names=[["업무","#ffd93d"],["담임","#8ee3c8"],["수업","#ffb3d1"],["자기 개발","#c9b6ff"],["생활","#ffc09f"],["주식","#d4f37a"],["건강","#9fd3ff"]];
  return {
    categories:names.map(([name,color],i)=>({id:uid()+i,name,color})),
    tasks:[],routines:[],routineDone:{},routineSkip:{},dayOrder:{},
    reminders:[],notified:{},settings:{}
  };
}
let db;
try{db=JSON.parse(localStorage.getItem(KEY))||null;}catch(e){db=null;}
if(!db){db=defaultDB();save();}
for(const k of ['tasks','routines','categories','reminders'])db[k]=db[k]||[];
for(const k of ['routineDone','routineSkip','dayOrder','notified','settings'])db[k]=db[k]||{};
db.categories.forEach(c=>{if(OLD_COLORS[c.color])c.color=OLD_COLORS[c.color];});
function save(){db.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(db));schedulePush();}

/* ========== 날짜 도우미 ========== */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const today=()=>fmt(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d);};
const monday=s=>{const d=parse(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return fmt(d);};
const weekDays=s=>{const m=monday(s);return Array.from({length:7},(_,i)=>addDays(m,i));};
const kdate=s=>{const d=parse(s);return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}`;};
const kdateShort=s=>{const d=parse(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;};
function weekLabel(s){
  const thu=parse(addDays(monday(s),3));
  const n=Math.ceil(thu.getDate()/7);
  return `${thu.getFullYear()}년 ${thu.getMonth()+1}월 ${n}주차`;
}
const nowLocalInput=()=>{const d=new Date();return `${fmt(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;};

/* ========== 상태 ========== */
const state={view:'home',date:today(),sheet:null,menu:false,month:null,rlist:'all'};
const cat=id=>db.categories.find(c=>c.id===id);
const catColor=id=>(cat(id)||{}).color||'#999';

/* ========== 항목 계산 ========== */
function routineActiveOn(r,date){
  if(r.start&&date<r.start)return false;
  if(r.end&&date>r.end)return false;
  const dow=parse(date).getDay();
  return (r.days||[0,1,2,3,4,5,6]).includes(dow);
}
function routineStatus(r){
  const t=today();
  if(r.start&&t<r.start)return ['예정','soon'];
  if(r.end&&t>r.end)return ['종료','end'];
  return ['진행 중',''];
}
function itemsFor(date){
  const out=[];
  db.tasks.forEach(t=>{ if(t.date===date) out.push({kind:'task',id:t.id,catId:t.catId,title:t.title,memo:t.memo,done:!!t.done,doneAt:t.doneAt||0,created:t.created||0,remind:t.remindAt}); });
  db.routines.forEach(r=>{
    if(!routineActiveOn(r,date)||db.routineSkip[r.id+'|'+date])return;
    const dn=db.routineDone[r.id+'|'+date];
    out.push({kind:'routine',id:'r:'+r.id,rid:r.id,catId:r.catId,title:r.title,memo:r.memo,done:!!dn,doneAt:dn||0,created:r.created||0,remind:r.remindTime});
  });
  return out;
}
function sortItems(items,date){
  const ord=db.dayOrder[date]||[];
  const key=it=>{const i=ord.indexOf(it.id);return i>=0?i:1e13+it.created;};
  const undone=items.filter(i=>!i.done).sort((a,b)=>key(a)-key(b));
  const done=items.filter(i=>i.done).sort((a,b)=>a.doneAt-b.doneAt);
  return undone.concat(done);
}
function setDayOrder(date,ids){
  const prev=(db.dayOrder[date]||[]).filter(id=>!ids.includes(id));
  db.dayOrder[date]=prev.concat(ids);
}
function undoneCount(date){return itemsFor(date).filter(i=>!i.done).length;}

}

/* ========== 드래그 정렬 ========== */
// 손가락이 움직일 때마다가 아니라 화면 주사율에 맞춰 한 번씩만 그리고,
// 항목 위치 측정은 실제로 자리가 바뀔 때만 다시 한다 (렉 방지)
function bindDrag(){
  document.querySelectorAll('.draglist').forEach(list=>{
    list.addEventListener('pointerdown',e=>{
      const h=e.target.closest('.handle');if(!h)return;
      const item=h.closest('.drag-item');if(!item||item.classList.contains('nodrag'))return;
      e.preventDefault();
      const pid=e.pointerId;try{h.setPointerCapture(pid);}catch(_){}
      let startY=e.clientY,lastY=startY,raf=0,tmr=0,sibs=[],mids=[];
      const measure=()=>{
        const t=item.style.transform;item.style.transform='';
        sibs=Array.from(list.querySelectorAll('.drag-item:not(.nodrag)'));
        mids=sibs.map(x=>{const r=x.getBoundingClientRect();return r.top+r.height/2;});
        item.style.transform=t;
      };
      item.classList.add('dragging');measure();
      const frame=()=>{
        raf=0;clearTimeout(tmr);tmr=0;
        const dy=lastY-startY;
        const idx=sibs.indexOf(item);const mid=mids[idx]+dy;
        let target=null;
        if(idx>0&&mid<mids[idx-1])target=sibs[idx-1];
        else if(idx<sibs.length-1&&mid>mids[idx+1])target=sibs[idx+1].nextSibling;
        if(target!==null){
          const b=item.getBoundingClientRect().top;
          list.insertBefore(item,target);
          startY+=item.getBoundingClientRect().top-b;
          measure();
        }
        item.style.transform=`translateY(${lastY-startY}px)`;
      };
      // 화면이 안 그려지는 상황(백그라운드 등)에서도 멈추지 않도록 32ms 안전장치
      const move=ev=>{lastY=ev.clientY;if(raf)return;raf=requestAnimationFrame(frame);tmr=setTimeout(()=>{if(raf){cancelAnimationFrame(raf);frame();}},32);};
      const up=()=>{
        h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
        if(raf){cancelAnimationFrame(raf);frame();}clearTimeout(tmr);
        item.classList.remove('dragging');item.style.transform='';
        const ids=Array.from(list.querySelectorAll('.drag-item:not(.nodrag)')).map(x=>x.dataset.id);
        const scope=list.dataset.scope;
        if(scope==='day')setDayOrder(state.date,ids);
        else if(scope==='routine'){ids.forEach((id,i)=>{const r=db.routines.find(x=>x.id===id);if(r)r.order=i;});}
        else if(scope==='cat'){db.categories.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));}
        save(); // 화면은 이미 새 순서라 다시 그리지 않는다
      };
      h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
    });
  });
}

/* ========== 스와이프(오른쪽으로 밀어 내일로) ========== */
let swipedAt=0;
function bindSwipe(){
  document.querySelectorAll('.draglist[data-scope="day"]').forEach(list=>{
    list.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button!==0)return;
      if(e.target.closest('.handle,.chk'))return;
      const item=e.target.closest('.item');if(!item||item.classList.contains('done'))return;
      const sw=item.querySelector('.sw');const x0=e.clientX,y0=e.clientY,pid=e.pointerId;let dx=0,active=false;
      const off=()=>{item.removeEventListener('pointermove',move);item.removeEventListener('pointerup',up);item.removeEventListener('pointercancel',up);};
      const move=ev=>{
        const mx=ev.clientX-x0,my=ev.clientY-y0;
        if(!active){
          if(Math.abs(mx)>12&&Math.abs(mx)>Math.abs(my)*1.5){active=true;item.classList.add('swiping');try{item.setPointerCapture(pid);}catch(_){}}
          else if(Math.abs(my)>10){off();return;}
          else return;
        }
        dx=Math.max(0,mx);sw.style.transform=`translateX(${dx}px)`;item.classList.toggle('ready',dx>90);
      };
      const up=()=>{
        off();if(!active)return;
        swipedAt=Date.now();item.classList.remove('swiping');
        if(dx>90){postpone(item.dataset.id);return;}
        sw.style.transform='';item.classList.remove('ready');
      };
      item.addEventListener('pointermove',move);item.addEventListener('pointerup',up);item.addEventListener('pointercancel',up);
    });
  });
}
function postpone(id){
  const from=state.date;
  if(id.startsWith('r:')){
    const rid=id.slice(2);db.routineSkip[rid+'|'+from]=true;save();render();
    toastUndo(`${kdateShort(from)} 루틴을 건너뛰었어요`,()=>{delete db.routineSkip[rid+'|'+from];save();render();});
  }else{
    const t=db.tasks.find(x=>x.id===id);if(!t)return;const to=addDays(t.date,1);t.date=to;save();render();
    toastUndo(`${kdateShort(to)}로 미뤘어요`,()=>{t.date=from;save();render();});
  }
}
function toastUndo(msg,fn){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span>${esc(msg)}</span><button class="undo">되돌리기</button>`;
  t.querySelector('.undo').onclick=()=>{fn();t.remove();};
  document.body.appendChild(t);setTimeout(()=>t.remove(),5000);
}

function logout(){stopSync();firebase.auth().signOut();}
function userRef(){return fbDb.collection("users").doc(fbUser.uid);}
function clean(o){return JSON.parse(JSON.stringify(o));}
// 처음 로그인한 기기: 서버 데이터와 이 기기 데이터를 합친다 (id 기준, 같은 이름 카테고리는 하나로)
function mergeDb(r,l){
  const out=Object.assign({},l,r);
  const catMap={};
  out.categories=(r.categories||[]).slice();
  (l.categories||[]).forEach(c=>{
    const same=out.categories.find(x=>x.id===c.id)||out.categories.find(x=>x.name===c.name);
    if(same)catMap[c.id]=same.id;else out.categories.push(c);
  });
  const union=(a,b)=>{const ids=new Set((a||[]).map(x=>x.id));return (a||[]).concat((b||[]).filter(x=>!ids.has(x.id)).map(x=>Object.assign({},x,{catId:catMap[x.catId]||x.catId})));};
  out.tasks=union(r.tasks,l.tasks);out.routines=union(r.routines,l.routines);
  const ids=new Set((r.reminders||[]).map(x=>x.id));out.reminders=(r.reminders||[]).concat((l.reminders||[]).filter(x=>!ids.has(x.id)));
  for(const k of ["routineDone","routineSkip","dayOrder","notified","settings"])out[k]=Object.assign({},l[k]||{},r[k]||{});
  return out;
}
async function startSync(){
  fbState="syncing";render();
  const ref=userRef();const mergedKey="dayplanner.merged."+fbUser.uid;
  try{
    const snap=await ref.get();
    if(!snap.exists){await pushNow();}
    else if(!localStorage.getItem(mergedKey)){db=mergeDb(snap.data().db||{},db);save();await pushNow();}
    localStorage.setItem(mergedKey,"1");
  }catch(e){console.warn("first sync",e);}
  unsubSnap=ref.onSnapshot(s=>{
    if(!s.exists||s.metadata.hasPendingWrites)return;
    const d=s.data();
    if(d.updatedAt&&d.updatedAt>(db.updatedAt||0)){db=d.db;localStorage.setItem(KEY,JSON.stringify(db));render();}
  });
  fbState="on";render();toast("기기 연동이 켜졌어요");
}
function stopSync(){if(unsubSnap){unsubSnap();unsubSnap=null;}fbState="idle";}
function pushNow(){
  if(!fbUser||!fbDb)return Promise.resolve();
  return userRef().set({db:clean(db),updatedAt:db.updatedAt||Date.now(),email:fbUser.email||""}).catch(e=>toast("동기화 실패: "+e.message,4000));
}

/* ========== 알림 ========== */
let swReg=null;
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(r=>swReg=r).catch(()=>{});}
function ensurePermission(force){
  if(!('Notification' in window)){if(force)toast('이 브라우저는 알림을 지원하지 않아요. 아이폰이면 홈 화면에 추가한 뒤 열어 주세요.',4000);return;}
  if(Notification.permission==='default'||force&&Notification.permission!=='granted'){
    Notification.requestPermission().then(()=>{render();if(Notification.permission==='granted')toast('알림이 허용됐어요');});
  }
}
async function notify(title,body,tag){
  if('Notification' in window&&Notification.permission==='granted'){
    try{
      const reg=swReg||await navigator.serviceWorker?.getRegistration();
      if(reg&&reg.showNotification){await reg.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png'});return;}
      new Notification(title,{body,tag,icon:'icon-192.png'});return;
    }catch(e){}
  }
  toast(`<b>${esc(title)}</b><br>${esc(body)}`,6000);
}
function checkReminders(){
  const now=new Date();const t=today();const hm=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const nowMs=now.getTime();const WIN=15*60*1000;let changed=false;
  const due=(dateStr,timeStr)=>{const ms=new Date(dateStr+'T'+timeStr).getTime();return nowMs>=ms&&nowMs-ms<WIN;};
  // 매일 리마인더
  db.reminders.filter(r=>r.enabled).forEach(r=>{
    const k=`d|${t}|${r.id}`;
    if(!db.notified[k]&&due(t,r.time)){
      const left=sortItems(itemsFor(t),t).filter(i=>!i.done);
      const body=left.length?`남은 할 일 ${left.length}개: `+left.slice(0,5).map(i=>i.title).join(', ')+(left.length>5?' …':''):'오늘 할 일을 모두 마쳤어요 🎉';
      notify(r.label||'오늘 할 일',body,k);db.notified[k]=nowMs;changed=true;
    }
  });
  // 할 일별 알림
  db.tasks.forEach(x=>{
    if(!x.remindAt||x.done)return;const k=`t|${x.id}`;
    if(db.notified[k]===x.remindAt)return;
    const ms=new Date(x.remindAt).getTime();
    if(nowMs>=ms&&nowMs-ms<WIN){notify(x.title,(cat(x.catId)||{}).name||'',k);db.notified[k]=x.remindAt;changed=true;}
  });
  // 루틴 알림
  db.routines.forEach(r=>{
    if(!r.remindTime||!routineActiveOn(r,t)||db.routineSkip[r.id+'|'+t]||db.routineDone[r.id+'|'+t])return;
    const k=`r|${t}|${r.id}`;
    if(!db.notified[k]&&due(t,r.remindTime)){notify(r.title,'매일 루틴 · '+((cat(r.catId)||{}).name||''),k);db.notified[k]=nowMs;changed=true;}
  });
  // 오래된 기록 정리
  Object.keys(db.notified).forEach(k=>{const v=db.notified[k];if(typeof v==='number'&&nowMs-v>3*86400000){delete db.notified[k];changed=true;}});
  if(changed)save();
}
setInterval(checkReminders,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders();if(state.view==='home')render();}});
window.addEventListener('focus',checkReminders);

render();
checkReminders();
