<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>굿바이브 · 캘린더에 알림 넣기</title>
<!--
  아이폰 홈 화면 앱(standalone) 안에서는 캘린더 열기가 막혀서, 이 페이지를 Safari 창으로 따로 열어 캘린더에 넣는다.
  넣을 내용(.ics)은 주소의 # 뒤에 담겨 오므로 서버로 보내지지 않는다.
-->
<style>
  :root{--ink:#111;--paper:#fffdf6;--yellow:#ffd93d;--mint:#8ee3c8;--muted:#5b5449}
  *{box-sizing:border-box}
  body{margin:0;background:#fbf6ea;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.55;word-break:keep-all}
  main{max-width:480px;margin:0 auto;padding:28px 18px 40px}
  h1{font-size:24px;margin:0 0 6px}
  p{margin:6px 0}
  .muted{color:var(--muted);font-size:15px}
  .box{background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:14px 16px;margin:16px 0;box-shadow:3px 3px 0 var(--ink)}
  .box.mint{background:var(--mint)}
  ul{margin:6px 0 0;padding-left:20px}
  li{margin:4px 0}
  .btn{display:block;width:100%;text-align:center;border:2.5px solid var(--ink);border-radius:14px;padding:15px;font-size:17px;font-weight:800;background:var(--yellow);color:var(--ink);box-shadow:3px 3px 0 var(--ink);text-decoration:none;margin-top:12px}
  .btn.ghost{background:var(--paper)}
  .btn:active{transform:translate(3px,3px);box-shadow:none}
  .glink{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed #b9b09e;color:var(--ink);text-decoration:none;font-weight:700}
  .glink:first-child{border-top:0}
  .glink span:last-child{white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
  .warn{background:#ffe1dc}
</style>
</head>
<body>
<main>
  <h1>📅 캘린더에 알림 넣기</h1>
  <p class="muted">굿바이브에서 고른 알림이에요. 휴대폰 캘린더에 넣어 두면 앱이 꺼져 있어도 그 시각에 알려 줘요.</p>
  <div id="app"></div>
</main>
<script>
(function(){
  const app=document.getElementById('app');
  let ics='';
  try{ics=decodeURIComponent(location.hash.slice(1));}catch(e){}
  if(!ics.startsWith('BEGIN:VCALENDAR')){
    app.innerHTML='<div class="box warn">넣을 알림을 찾지 못했어요. 굿바이브 → 리마인더 관리에서 버튼을 다시 눌러 주세요.</div>';
    return;
  }
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // 접힌 줄을 펴고 일정별로 나눈다
  const lines=ics.replace(/\r\n[ \t]/g,'').split(/\r?\n/);
  const events=[];let cur=null;
  for(const l of lines){
    if(l==='BEGIN:VEVENT')cur={};
    else if(l==='END:VEVENT'){events.push(cur);cur=null;}
    else if(cur&&!cur._alarm){
      if(l==='BEGIN:VALARM'){cur._alarm=true;continue;}
      const i=l.indexOf(':');const k=l.slice(0,i),v=l.slice(i+1);
      if(['SUMMARY','DTSTART','DTEND','RRULE','DESCRIPTION'].includes(k))cur[k]=v.replace(/\\n/g,'\n').replace(/\\([,;\\])/g,'$1');
    }else if(cur&&l==='END:VALARM')cur._alarm=false;
  }
  const DAYS={SU:'일',MO:'월',TU:'화',WE:'수',TH:'목',FR:'금',SA:'토'};
  const hm=d=>d.slice(9,11)+':'+d.slice(11,13);
  const when=e=>{
    const r=e.RRULE||'';
    if(r.startsWith('FREQ=DAILY'))return '매일 '+hm(e.DTSTART);
    if(r.startsWith('FREQ=WEEKLY')){const m=r.match(/BYDAY=([A-Z,]+)/);return (m?m[1].split(',').map(x=>DAYS[x]).join('·'):'매주')+' '+hm(e.DTSTART);}
    return (+e.DTSTART.slice(4,6))+'월 '+(+e.DTSTART.slice(6,8))+'일 '+hm(e.DTSTART);
  };
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Seoul';
  const gcal=e=>{
    const p=new URLSearchParams({action:'TEMPLATE',text:e.SUMMARY||'굿바이브',dates:e.DTSTART+'/'+(e.DTEND||e.DTSTART),details:e.DESCRIPTION||'',ctz:tz});
    if(e.RRULE)p.set('recur','RRULE:'+e.RRULE);
    return 'https://calendar.google.com/calendar/render?'+p.toString();
  };
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const dataUrl='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);

  let h='<div class="box"><b>넣을 알림 '+events.length+'개</b><ul>'+events.map(e=>'<li>'+esc(when(e))+' · '+esc(e.SUMMARY||'')+'</li>').join('')+'</ul></div>';
  if(standalone){
    // 이 페이지가 홈 화면 앱 안에서 열렸다면 여기서도 막힌다 → Safari 로 옮겨 열게 한다
    h+='<div class="box warn"><b>지금 화면에서는 아이폰이 캘린더 열기를 막아요.</b><br>아래 버튼으로 주소를 복사한 뒤 <b>Safari</b>를 열어 주소창에 붙여 넣고 이동해 주세요.</div>';
    h+='<button class="btn" id="copy">주소 복사하기</button>';
  }else{
    h+='<a class="btn" href="'+dataUrl+'">아이폰 캘린더에 넣기</a>';
    h+='<p class="muted" style="margin-top:10px">누르면 <b>허용</b> → <b>모두 추가</b>를 눌러 주세요. 다 넣었으면 이 창을 닫고 굿바이브로 돌아가면 돼요.</p>';
  }
  h+='<div class="box"><b>그래도 안 되면: 구글 캘린더로 하나씩 넣기</b><p class="muted">구글 캘린더 앱이나 구글 계정을 쓰는 경우예요. 알림 시각은 구글 캘린더 기본 설정을 따르니, 넣은 뒤 알림을 "일정 시간"으로 바꿔 주세요.</p>'
    +events.map(e=>'<a class="glink" href="'+esc(gcal(e))+'" target="_blank" rel="noopener"><span>'+esc(when(e))+' · '+esc(e.SUMMARY||'')+'</span><span>넣기</span></a>').join('')+'</div>';
  app.innerHTML=h;
  const copy=document.getElementById('copy');
  if(copy)copy.onclick=()=>{
    navigator.clipboard.writeText(location.href).then(()=>{copy.textContent='복사했어요 · Safari 주소창에 붙여 넣기';}).catch(()=>{prompt('이 주소를 길게 눌러 복사해 주세요',location.href);});
  };
})();
</script>
</body>
</html>
